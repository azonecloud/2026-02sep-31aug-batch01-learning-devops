# =========================
# Database (PostgreSQL)
# =========================
DB_HOST=host.docker.internal
#DB_HOST=host.minikube.internal

DB_PORT=5432
DB_NAME=postgres
DB_USER=postgres
DB_PASSWORD=MainPassword1%

DB_POOL_MAX_SIZE=20
DB_POOL_MIN_IDLE=5

# =========================
# Kafka
# =========================
KAFKA_BOOTSTRAP_SERVERS=kafka:9092
#KAFKA_BOOTSTRAP_SERVERS=kafka-service.order-service.svc.cluster.local:9092

KAFKA_CONSUMER_GROUP=order-service-group
KAFKA_AUTO_OFFSET_RESET=earliest

KAFKA_TOPIC_ORDERS=order-events
KAFKA_TOPIC_PAYMENTS=payment-events

KAFKA_LISTENER_AUTO_STARTUP=true
KAFKA_ACKS=all
KAFKA_RETRIES=3
KAFKA_TRUSTED_PACKAGES=*

# =========================
# Spring Datasource
# =========================
SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
SPRING_DATASOURCE_USERNAME=${DB_USER}
SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
SPRING_KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP}

# =========================
# Server
# =========================
SERVER_PORT=8080

# =========================
# JPA / Hibernate
# =========================
JPA_DDL_AUTO=validate
JPA_SHOW_SQL=false

HIBERNATE_BATCH_SIZE=20
HIBERNATE_FETCH_SIZE=50

# =========================
# Logging
# =========================
LOG_LEVEL=INFO
LOG_LEVEL_KAFKA=WARN
LOG_LEVEL_HIBERNATE=WARN
LOG_LEVEL_APP=DEBUG

# =========================
# Actuator
# =========================
MANAGEMENT_HEALTH_DETAILS=always

# =========================
# AWS
# =========================
AWS_REGION=us-east-1

# =========================
# Tomcat
# =========================
TOMCAT_MAX_THREADS=200
TOMCAT_MIN_SPARE=10

# =========================
# Spring Boot Application
# =========================
spring.application.name=aws-order-service

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.cache=true

# =========================
# Datasource
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:20}
spring.jpa.properties.hibernate.jdbc.fetch_size=${HIBERNATE_FETCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=${KAFKA_ACKS:all}
spring.kafka.producer.retries=${KAFKA_RETRIES:3}

spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:order-service-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:*}

# =========================
# Server
# =========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:10}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =========================
# Logging
# =========================
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.apache.kafka=${LOG_LEVEL_KAFKA:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.com.aws.order=${LOG_LEVEL_APP:DEBUG}

# =========================
# Application-specific
# =========================
app.kafka.topic.orders=${KAFKA_TOPIC_ORDERS:order-events}
app.kafka.topic.payments=${KAFKA_TOPIC_PAYMENTS:payment-events}
app.aws.region=${AWS_REGION:us-east-1}

# =========================
# ANSI Output
# =========================
spring.output.ansi.enabled=${ANSI_OUTPUT:always}